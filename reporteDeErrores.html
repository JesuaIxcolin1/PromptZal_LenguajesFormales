<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>REPORTE DE ERRORES</title>
<style>
body { font-family: Arial; margin: 40px; background-color: #C9C9C9 }
h1 { text-align: center; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 3px solid #333; padding: 8px; text-align: center; }
th { background-color: black; color: white; font-weight: bold;}
td: nth-child(1) {text-align: left;}
</style>
</head>
<body>
<h1>REPORTE DE ERRORES</h1>
<table>
<tr>
<th>LEXEMA</th>
<th>TIPO DE ERROR</th>\n<th>FILA</th>
<th>COLUMNA</th>
</tr>
<tr>
<td>"claude-sonnet-4-6</td>
<td style="background-color: #85513C; font-weight: bold;">Cadena sin cerrar</td>
<td>1</td>
<td>9</td>
</tr>
<tr>
<td>10.</td>
<td style="background-color: #E0E0E0; font-weight: bold;">Numero decimal invalido</td>
<td>5</td>
<td>23</td>
</tr>
<tr>
<td>"Hola</td>
<td style="background-color: #85513C; font-weight: bold;">Cadena sin cerrar</td>
<td>6</td>
<td>15</td>
</tr>
<tr>
<td>-</td>
<td style="background-color: #E0E0E0; font-weight: bold;">Conector Incompleto</td>
<td>8</td>
<td>5</td>
</tr>
<tr>
<td>$</td>
<td style="background-color: #224D3A; font-weight: bold;">Caracter no reconocido</td>

<td>5</td>
</tr>
<tr>
<td>/* comentario que no cierra
}
</td>
<td style="background-color: #E0E0E0; font-weight: bold;">Comentario de Bloque sin cerrar</td>
<td>10</td>
<td>5</td>
</tr>
</table>
</body>
</html>
