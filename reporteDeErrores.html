<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>REPORTE DE ERRORES</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; background: #F5F1E8; color: #1F1F1F; }
.encabezado { background: linear-gradient(90deg, #007A5E, #3FAF8F); color: white; padding: 25px; text-align: center; }
.encabezado h1 { margin: 0; font-size: 34px; }
.encabezado p { margin: 8px 0 0 0; font-size: 15px; }
.contenedor { width: 90%; margin: 30px auto; }
.card { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); margin-bottom: 25px; }
table { width: 100%; border-collapse: collapse; margin-top: 15px; }
th { background: #007A5E; color: white; padding: 12px; font-size: 14px; }
td { border-bottom: 1px solid #DDD; padding: 10px; text-align: center; font-size: 14px; }
tr:nth-child(even) { background: #F8F8F8; }
.mensaje { font-size: 22px; font-weight: bold; color: #007A5E; text-align: center; padding: 30px; }
</style>
</head>
<body>
<div class="encabezado">
<h1>REPORTE DE ERRORES</h1>
<p>PromptZal</p>
</div>
<div class="contenedor">
<div class="card">
<h2>Listado de Errores Lexicos</h2>
<table>
<tr>
<th>Numero</th>
<th>Lexema</th>
<th>Tipo de Error</th>
<th>Fila</th>
<th>Columna</th>
</tr>
<tr>
<td>1</td>
<td>@Desconocido</td>
<td style="background-color:#C62828; color:white; font-weight:bold;">Directiva no reconocida</td>
<td>7</td>
<td>1</td>
</tr>
<tr>
<td>2</td>
<td>"Cadena sin cerra</td>
<td style="background-color:#C62828; color:white; font-weight:bold;">Cadena sin cerrar</td>
<td>11</td>
<td>1</td>
</tr>
<tr>
<td>3</td>
<td>@Hola</td>
<td style="background-color:#C62828; color:white; font-weight:bold;">Directiva no reconocida</td>
<td>12</td>
<td>1</td>
</tr>
</table>
</div>
</div>
</body>
</html>
